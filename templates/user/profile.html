{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 shadow-sm">
      <h3 class="mb-3">My Profile</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
          <div class="form-text">Email cannot be changed.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">New password <span class="text-muted small">(leave blank to keep current)</span></label>
          <input type="password" name="new_password" class="form-control" minlength="6">
        </div>
        <button type="submit" class="btn btn-success w-100">Save changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
